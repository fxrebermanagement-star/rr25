<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RR25">
<meta name="mobile-web-app-capable" content="yes">
<title>Rolf Reber 25</title>
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#090614;--elev:rgba(48,18,72,.7);--line:rgba(126,200,255,.2);--ink:#f6f0ff;--dim:#c4b4e0;--pink:#ff7ad9}
*{box-sizing:border-box}html,body{margin:0;min-height:100dvh;background:#090614;color:var(--ink);font:15px/1.45 system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:28rem;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{padding:calc(.38rem + env(safe-area-inset-top)) .8rem .42rem;position:sticky;top:0;background:rgba(10,6,20,.8);backdrop-filter:blur(14px);z-index:5}
#headRow{position:relative;min-height:54px;margin:0 0 .08rem}
#moonWrap{position:absolute;left:0;top:0;text-align:center;width:4.4rem}
#sunWrap{position:absolute;right:0;top:0;text-align:center;width:4.6rem}
#moonSym,#sunSym{display:block;font-size:2.05rem;line-height:1}
#moonTxt,#sunTxt{display:block;margin-top:.22rem;font-size:.6rem;letter-spacing:.02em;color:#c4b4e0;line-height:1.25}
.doll{width:54px;height:54px;object-fit:cover;border-radius:17px;margin:0 auto;display:block;border:1px solid rgba(255,122,217,.55);background:#12081c}
.brand{font-family:Georgia,serif;letter-spacing:.32em;font-size:.7rem;color:#ff7ad9;text-align:center;margin:.14rem 0 0}
.sub{display:none}
nav{display:grid;grid-template-columns:repeat(6,1fr);gap:.18rem;padding:.28rem .16rem calc(.28rem + env(safe-area-inset-bottom));background:rgba(8,4,18,.75);border:1px solid var(--line)}
nav button{border:0;background:transparent;color:var(--dim);border-radius:.75rem;padding:.55rem .08rem .48rem;font:inherit;font-size:.58rem;letter-spacing:.03em;display:flex;flex-direction:column;align-items:center;gap:.16rem}
nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav button.on{background:linear-gradient(165deg,#ff7ad9,#7ec8ff);color:#14081c;font-weight:650}
.app.runmode header .doll,.app.runmode header .brand,.app.runmode header .sub,.app.runmode #moonWrap,.app.runmode #sunWrap,.app.runmode #headRow{display:none}
.app.runmode header{padding-top:calc(.22rem + env(safe-area-inset-top));padding-bottom:.28rem}
main{flex:1;padding:0 .8rem 6.8rem}
.hero h2{font-family:Georgia,serif;font-weight:500;margin:.45rem 0 .28rem;font-size:1.28rem}
#cats{display:flex;flex-wrap:wrap;gap:.36rem;margin:.55rem 0 .45rem}
#cats [data-cat="Alle"],#cats [data-cat="Alltag"]{display:none!important}
.card{background:var(--elev);border:1px solid var(--line);border-radius:1.15rem;padding:.75rem .8rem;width:100%;color:inherit;font:inherit;text-align:left;margin:.24rem 0}
.card b{display:block;font-family:Georgia,serif;font-size:.95rem}
.card small{display:block;color:var(--dim);margin-top:.16rem;font-size:.75rem}
.screen{display:none}.screen.on{display:block}
.words{font-family:Georgia,serif;font-size:1.05rem;line-height:1.6;white-space:pre-wrap}
#run .words{font-size:1.18rem;line-height:1.76}
#run .hero h2{font-size:1.26rem;margin:.15rem 0 .4rem}
#run .sub{display:block!important;text-align:left;letter-spacing:.1em;text-transform:uppercase;font-size:.64rem;margin:0}
.pbar{height:3px;background:rgba(126,200,255,.14);border-radius:99px;margin:.2rem 0 .8rem;overflow:hidden}
.pbar::before{content:"";display:block;height:100%;width:var(--p,8%);background:linear-gradient(90deg,#ff7ad9,#7ec8ff,#7dffa3);border-radius:99px}
input,textarea,select{width:100%;background:#140a22;border:1px solid var(--line);color:var(--ink);border-radius:.85rem;padding:.62rem .7rem;font:inherit;margin:.28rem 0}
textarea{min-height:5.2rem}
.row{display:flex;gap:.35rem;margin-top:.7rem}
.btn{flex:1;border:0;border-radius:999px;padding:.62rem .4rem;font:inherit;font-size:.78rem;font-weight:650;min-height:2.4rem}
.primary{background:linear-gradient(135deg,#ff7ad9,#7ec8ff);color:#14081c}
.ghost{background:var(--elev);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--elev);color:var(--dim);border-radius:999px;padding:.42rem .72rem;margin:0;font:inherit;font-size:.76rem;min-height:2.05rem}
.chip.on{color:#14081c;background:linear-gradient(165deg,#ff7ad9,#7ef0e6);border-color:transparent;font-weight:650}
.group{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);margin:1.1rem 0 .3rem}
.check{display:none}
.msg{color:var(--pink);font-style:italic}
.entry{border-top:1px solid var(--line);padding:.8rem 0}
.meta{color:#8e7aa8;font-size:.68rem}
.shots{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0}
.shots img{width:4.4rem;height:4.4rem;object-fit:cover;border-radius:.7rem;border:1px solid var(--line)}
#page{padding:.9rem .85rem 1.6rem}
#after .hero{padding:1.8rem 0 .8rem}
#after .brand{font-size:.82rem;letter-spacing:.42em}
#home{padding-top:.2rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.42rem;align-items:stretch;margin-top:.15rem}
#kOut,#sigilBox{aspect-ratio:1/1;height:auto;min-height:0;margin:0;padding:0;overflow:hidden;border-radius:1.15rem}
#kOut{border:1px solid rgba(255,122,217,.38)}
#kOut .kcard{height:100%;margin:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center;padding:.55rem .5rem}
#sigilBox{background:#0a0612;border:1px solid rgba(46,230,214,.28);overflow:hidden;padding:0}
#sigilC{width:100%;height:100%;display:block;margin:0;border:0;border-radius:1.15rem;background:transparent}
#under{display:grid;grid-template-columns:1fr 1fr;gap:.4rem;margin-top:.48rem}
#underL,#underR{display:flex;flex-direction:column;gap:.35rem}
#under .btn{width:100%;margin:0;min-height:2.45rem}
#under input{margin:0;width:100%}
#dreiList .kcard{margin:.48rem 0;padding:1.05rem .95rem}
.kcard{background:linear-gradient(185deg,rgba(70,24,90,.62),rgba(12,8,28,.92));border:1px solid rgba(255,122,217,.16);border-radius:1rem;padding:.7rem .55rem .75rem;margin:.3rem 0;text-align:center}
.kcard .group{margin:0 0 .15rem}
.kz{font-size:1.35rem;line-height:1;color:#7ef0e6;margin:.05rem 0 .25rem}
.kcard b{display:block;font-family:Georgia,serif;font-size:.92rem;margin:0 0 .25rem}
.kcard small{display:block;color:#c4b4e0;line-height:1.35;font-size:.68rem}
#list .card{padding:1rem 1.05rem;margin:.42rem 0;border-radius:1.15rem}
#list .card b{font-size:1.08rem}
#list .card small{font-size:.8rem;margin-top:.22rem}
</style>
</head>
<body>
<div class="app">
<header>
<div id="headRow">
<div id="moonWrap"><span id="moonSym"></span><span id="moonTxt"></span></div>
<img class="doll" alt="" src="rune.svg">
<div id="sunWrap"><span id="sunSym"></span><span id="sunTxt"></span></div>
</div>
<p class="brand">ROLF REBER 25</p>
<p class="sub"></p>
</header>
<main>
<section class="screen on" id="home">
<button type="button" id="quick" hidden></button>
<div id="kasten">
<div class="duo">
<div id="kOut"></div>
<div id="sigilBox"><canvas id="sigilC" width="360" height="360"></canvas></div>
</div>
<div id="under">
<div id="underL">
<button type="button" class="btn primary" id="kTag">Karte</button>
<button type="button" class="btn ghost" id="kDrei">Drei</button>
</div>
<div id="underR">
<input id="sigilT" placeholder="Absicht">
<button type="button" class="btn ghost" id="sigilGo">Zeichen</button>
<button type="button" class="btn ghost" id="sigilSave">Ablegen</button>
</div>
</div>
</div>
<div id="cats"></div><div id="list"></div>
</section>
<section class="screen" id="drei">
<div class="hero"><h2>Drei</h2><p class="sub">Lage · Block · Weg</p></div>
<div id="dreiList"></div>
<div class="row"><button type="button" class="btn ghost" id="dreiBack">Zurück</button></div>
</section>
<section class="screen" id="zahl">
<div class="hero"><h2>369</h2><p class="sub">Heute. Tippen zählt.</p></div>
<div id="zahlBox"></div>
<div class="row"><button type="button" class="btn ghost" id="zahlBack">Zurück</button></div>
</section>
<section class="screen" id="run"></section>
<section class="screen" id="geplant"><div class="hero"><h2>Geplant</h2></div>
<div class="card"><select id="plR"></select><input id="plW" placeholder="Für wen">
<div class="row"><button type="button" class="btn ghost" id="plAdd">Vormerken</button></div><div id="plList"></div></div></section>
<section class="screen" id="notiz"><div class="hero"><h2>Notiz</h2></div>
<div class="card"><textarea id="noteT" placeholder="Neue Notiz"></textarea>
<div class="row"><button type="button" class="btn primary" id="noteAdd">Speichern</button></div></div>
<div id="notesOnly"></div></section>
<section class="screen" id="log"><div class="hero"><h2>Chronik</h2></div><div id="entries"></div></section>
<section class="screen" id="buch">
<div class="hero"><h2>Buch</h2><p class="sub">komplett zum Lesen</p></div>
<article class="card book" id="page"></article>
</section>
<section class="screen" id="after"><div class="hero" style="text-align:center"><p class="brand">SO SEI ES</p></div>
<div class="row"><button type="button" class="btn ghost" id="afterStay">Später</button><button type="button" class="btn primary" id="afterGo">Übergeben</button></div></section>
<section class="screen" id="bye"><div class="hero" style="text-align:center;padding:4rem 0"><p class="brand">SO SEI ES</p>
<div class="row"><button type="button" class="btn ghost" id="stay">Bleiben</button></div></div></section>
</main>
<nav>
<button type="button" class="on" data-v="home"><svg viewBox="0 0 24 24"><path d="M12 3l1.2 3.6L17 8l-3.8 1.4L12 13l-1.2-3.6L7 8l3.8-1.4z"/><path d="M8 16h8M9 19h6"/></svg>Rituale</button>
<button type="button" data-v="person"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2"/><path d="M6 19c.8-3.2 3-5 6-5s5.2 1.8 6 5"/></svg>Person</button>
<button type="button" data-v="geplant"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Geplant</button>
<button type="button" data-v="notiz"><svg viewBox="0 0 24 24"><path d="M7 4h8l5 5v11H7z"/><path d="M15 4v5h5M9 13h6M9 17h4"/></svg>Notiz</button>
<button type="button" data-v="log"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>Chronik</button>
<button type="button" data-v="buch"><svg viewBox="0 0 24 24"><path d="M5 5h11a3 3 0 013 3v12H8a3 3 0 01-3-3V5z"/><path d="M8 20a3 3 0 01-3-3"/></svg>Buch</button>
</nav>
</div>
<script src="doll.js"></script>
<script src="ritual-core.js"></script>
<script src="ritual-list.js?v=1"></script>
<script src="ritual-prep.js"></script>
<script src="ritual-steps.js?v=7"></script>
<script src="ritual-schaden.js"></script>
<script src="ritual-drop.js?v=2"></script>
<script src="ritual-wesen.js?v=1"></script>
<script src="ritual-gate.js?v=2"></script>
<script src="ritual-filter.js?v=8"></script>
<script src="ritual-karten.js?v=6"></script>
<script src="ritual-sigil.js?v=5"></script>
<script src="ritual-log.js?v=2"></script>
<script src="ritual-notes.js"></script>
<script src="ritual-plus.js?v=2"></script>
<script src="ritual-close.js"></script>
<script src="ritual-polish.js"></script>
<script src="ritual-lightbox.js"></script>
<script src="ritual-nav.js?v=2"></script>
<script src="ritual-layout.js?v=3"></script>
<script src="ritual-look.js?v=12"></script>
<script src="ritual-extra.js?v=14"></script>
<script src="ritual-zahl.js?v=2"></script>
<script src="ritual-home.js?v=6"></script>
<script src="ritual-wesen-run.js?v=3"></script>
<script src="ritual-finst.js"></script>
<script src="ritual-liebe-zw.js"></script>
<script src="ritual-person.js?v=4"></script>
<script src="ritual-wort.js?v=8"></script>
<script src="ritual-ueber.js?v=2"></script>
<script src="ritual-backup.js?v=3"></script>
<script src="pwa.js"></script>
<script>
(function(){
  function addChip(){
    var cats=document.getElementById("cats");
    if(!cats) return;
    if(!cats.querySelector('[data-cat="Person X"]')){
      var b=document.createElement("button");
      b.className="chip"+(typeof cat!=="undefined"&&cat==="Person X"?" on":"");
      b.setAttribute("data-cat","Person X");
      b.textContent="Person X";
      b.onclick=function(){ cat="Person X"; if(typeof renderList==="function") renderList(); };
      cats.appendChild(b);
    }
  }
  if(typeof renderList==="function"){
    var prev=renderList;
    renderList=function(){ prev(); addChip(); };
  }
  addChip();
  setTimeout(addChip,200);
  setTimeout(addChip,800);
})();
</script>
</body>
</html>
