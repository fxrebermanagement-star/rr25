<!DOCTYPE html>
<html lang="de" data-edition="0">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090614">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RR25">
<title>Rolf Reber 25</title>
<link rel="manifest" href="manifest.webmanifest?v=0">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{--bg:#090614;--elev:rgba(48,18,72,.7);--line:rgba(126,200,255,.2);--ink:#f6f0ff;--dim:#c4b4e0;--pink:#ff7ad9}
*{box-sizing:border-box}html,body{margin:0;min-height:100dvh;background:#090614;color:var(--ink);font:15px/1.45 system-ui,sans-serif}
.app{max-width:28rem;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{padding:calc(.38rem + env(safe-area-inset-top)) .8rem .42rem;position:sticky;top:0;background:rgba(10,6,20,.8);backdrop-filter:blur(14px);z-index:5}
#headRow{position:relative;min-height:54px}
#moonWrap{position:absolute;left:0;top:0;text-align:center;width:4.4rem}
#sunWrap{position:absolute;right:0;top:0;text-align:center;width:4.6rem}
#moonSym,#sunSym{display:block;font-size:2.05rem;line-height:1}
#moonTxt,#sunTxt{display:block;margin-top:.22rem;font-size:.6rem;color:#c4b4e0;line-height:1.25}
.doll{width:54px;height:54px;object-fit:cover;border-radius:17px;margin:0 auto;display:block;border:1px solid rgba(255,122,217,.55)}
.brand{font-family:Georgia,serif;letter-spacing:.32em;font-size:.7rem;color:#ff7ad9;text-align:center;margin:.14rem 0 0}
.sub{display:none}
nav{display:flex;flex-direction:column;gap:.16rem;padding:.32rem .2rem calc(.36rem + env(safe-area-inset-bottom));background:rgba(8,4,18,.75);border:1px solid var(--line)}
nav .navR{display:grid;gap:.16rem}
nav .navR:first-child{grid-template-columns:repeat(4,1fr)}
nav .navR:last-child{grid-template-columns:repeat(3,1fr);padding:0 7%}
nav button{border:0;background:transparent;color:var(--dim);border-radius:.75rem;padding:.44rem .04rem .34rem;font:inherit;font-size:.6rem;display:flex;flex-direction:column;align-items:center;gap:.14rem;min-height:2.5rem}
nav button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7}
nav button.on{background:linear-gradient(165deg,#ff7ad9,#7ec8ff);color:#14081c;font-weight:650}
.app.runmode header .doll,.app.runmode header .brand,.app.runmode #moonWrap,.app.runmode #sunWrap,.app.runmode #headRow{display:none}
main{flex:1;padding:0 .8rem 8.6rem}
.hero h2{font-family:Georgia,serif;font-weight:500;margin:.45rem 0 .28rem;font-size:1.28rem}
#cats{display:flex;flex-wrap:wrap;gap:.36rem;margin:.55rem 0 .45rem}
#cats [data-cat="Alle"],#cats [data-cat="Alltag"]{display:none!important}
.card{background:var(--elev);border:1px solid var(--line);border-radius:1.15rem;padding:.75rem .8rem;width:100%;color:inherit;font:inherit;text-align:left;margin:.24rem 0}
.card b{display:block;font-family:Georgia,serif}
.card small{display:block;color:var(--dim);margin-top:.16rem;font-size:.75rem}
.screen{display:none}.screen.on{display:block}
.words{font-family:Georgia,serif;font-size:1.05rem;line-height:1.6;white-space:pre-wrap}
input,textarea,select{width:100%;background:#140a22;border:1px solid var(--line);color:var(--ink);border-radius:.85rem;padding:.62rem .7rem;font:inherit;margin:.28rem 0}
textarea{min-height:5.2rem}
.row{display:flex;gap:.35rem;margin-top:.7rem}
.btn{flex:1;border:0;border-radius:999px;padding:.62rem .4rem;font:inherit;font-size:.78rem;font-weight:650;min-height:2.4rem}
.primary{background:linear-gradient(135deg,#ff7ad9,#7ec8ff);color:#14081c}
.ghost{background:var(--elev);color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--elev);color:var(--dim);border-radius:999px;padding:.42rem .72rem;font:inherit;font-size:.76rem;min-height:2.05rem}
.chip.on{color:#14081c;background:linear-gradient(165deg,#ff7ad9,#7ef0e6);border-color:transparent}
.group{font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);margin:1.1rem 0 .3rem}
.check{display:none}
.msg{color:var(--pink);font-style:italic}
.meta{color:#8e7aa8;font-size:.68rem}
.shots img{width:5.2rem;height:5.2rem;object-fit:cover;border-radius:.8rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:.42rem}
#kOut,#sigilBox{aspect-ratio:1/1;border-radius:1.15rem;overflow:hidden}
#kOut{border:1px solid rgba(255,122,217,.38)}
#sigilBox{background:#0a0612;border:1px solid rgba(46,230,214,.28)}
#sigilC{width:100%;height:100%;display:block}
#run label.check,#afterStay,#stay,#under{display:none!important}
#list{display:block}
#home:has(#cats .chip.on) #skizze,#home:has(#list .card) #skizze{display:none!important}
</style>
</head>
<body>
<div class="app">
<header>
<div id="headRow">
<div id="moonWrap"><span id="moonSym"></span><span id="moonTxt"></span></div>
<img class="doll" alt="" src="rune.svg">
<div id="sunWrap"><span id="sunSym"></span><span id="sunTxt"></span></div>
</div>
<p class="brand">ROLF REBER 25</p>
</header>
<main>
<section class="screen on" id="home">
<button type="button" id="quick" hidden></button>
<div id="kasten">
<div class="duo">
<div id="kOut"></div>
<div id="sigilBox"><canvas id="sigilC" width="360" height="360"></canvas></div>
</div>
<div id="under">
<button type="button" class="btn primary" id="kTag">Karte</button>
<button type="button" class="btn ghost" id="kDrei">Drei</button>
<input id="sigilT" placeholder="Absicht" autocomplete="off">
<button type="button" class="btn ghost" id="sigilGo">Zeichen</button>
<button type="button" class="btn ghost" id="sigilSave">Ablegen</button>
</div>
</div>
<div id="cats"></div><div id="list"></div>
</section>
<section class="screen" id="drei"><div class="hero"><h2>Drei</h2></div><div id="dreiList"></div><div class="row"><button type="button" class="btn ghost" id="dreiBack">Zurück</button></div></section>
<section class="screen" id="zahl"><div class="hero"><h2>369</h2></div><div id="zahlBox"></div><div class="row"><button type="button" class="btn ghost" id="zahlBack">Zurück</button></div></section>
<section class="screen" id="run"></section>
<section class="screen" id="geplant"><div class="hero"><h2>Geplant</h2></div>
<div class="card"><select id="plR"></select><input id="plW" placeholder="Für wen" autocomplete="off">
<div class="row"><button type="button" class="btn ghost" id="plAdd">Vormerken</button></div><div id="plList"></div></div></section>
<section class="screen" id="notiz"><div class="hero"><h2>Notiz</h2></div>
<div class="card"><textarea id="noteT" placeholder="Neue Notiz"></textarea>
<div class="row"><button type="button" class="btn primary" id="noteAdd">Speichern</button></div></div>
<div id="notesOnly"></div></section>
<section class="screen" id="opfer"><div class="hero"><h2>Gabe</h2></div>
<div class="card"><textarea id="opferT" placeholder="Was du gibst. Für wen. Warum."></textarea>
<div id="opferPrev" class="shots"></div>
<div class="row"><button type="button" class="btn ghost" id="opferFoto">Foto</button><button type="button" class="btn primary" id="opferGo">Ablegen</button></div>
<p class="msg" id="opferMsg"></p></div></section>
<section class="screen" id="log"><div class="hero"><h2>Chronik</h2></div><div id="entries"></div></section>
<section class="screen" id="buch"><div class="hero"><h2>Buch</h2></div><article class="card book" id="page"></article></section>
<section class="screen" id="kal">
<div class="hero"><h2>Magie so sei es</h2></div>
<div class="row" style="margin:.2rem 0 .7rem"><button type="button" class="btn ghost" id="kalOpen">In Google öffnen</button></div>
<div id="kalList"></div>
</section>
<section class="screen" id="after"><div class="hero" style="text-align:center"><p class="brand">SO SEI ES</p></div>
<div class="row"><button type="button" class="btn primary" id="afterGo">Fertig</button></div></section>
<section class="screen" id="bye"></section>
</main>
<nav>
<div class="navR">
<button type="button" class="on" data-v="home"><svg viewBox="0 0 24 24"><path d="M12 3l1.2 3.6L17 8l-3.8 1.4L12 13l-1.2-3.6L7 8l3.8-1.4z"/><path d="M8 16h8M9 19h6"/></svg>Rituale</button>
<button type="button" data-v="geplant"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>Geplant</button>
<button type="button" data-v="kal"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16M8 14h3M13 18h3"/></svg>Kalender</button>
<button type="button" data-v="log"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v5l3 2"/></svg>Chronik</button>
</div>
<div class="navR">
<button type="button" data-v="notiz"><svg viewBox="0 0 24 24"><path d="M7 4h8l5 5v11H7z"/><path d="M15 4v5h5M9 13h6M9 17h4"/></svg>Notiz</button>
<button type="button" data-v="opfer"><svg viewBox="0 0 24 24"><path d="M12 4l2.2 4.6L19 10l-4.8 1.8L12 17l-2.2-5.2L5 10l4.8-1.4z"/><path d="M7 19h10"/></svg>Gabe</button>
<button type="button" data-v="buch"><svg viewBox="0 0 24 24"><path d="M5 5h11a3 3 0 013 3v12H8a3 3 0 01-3-3V5z"/><path d="M8 20a3 3 0 01-3-3"/></svg>Buch</button>
</div>
</nav>
</div>
